name: Build and publish Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to checkout and publish (e.g. v2026.05.14). Leave blank to build from the current default branch.'
        required: false
        default: ''

# All refs share `latest`, so serialize publishers across tags and branches.
# Keep queued releases instead of replacing an earlier pending release.
concurrency:
  group: otc-x-docker-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write
  id-token: write     # required for cosign keyless signing via Sigstore OIDC
  attestations: write # required for build-push-action provenance attestations

jobs:
  build-and-push:
    name: Build, sign and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # When triggered manually with a tag input, check out exactly that
          # tag so the image content matches the published version label.
          # Without this override, workflow_dispatch would build whatever is
          # currently on the default branch and publish it under the input
          # tag — a tag-integrity gap a banking-grade reviewer would flag.
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Record exact source revision
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Gate the exact checked-out release and data snapshot before credentials,
      # image building or publication. Keep the existing container Python minor.
      - name: Set up Python for release validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python -m pip check

      - name: Test the release snapshot
        run: python -m pytest tests/ -q --junitxml="${{ runner.temp }}/release-tests.xml"

      - name: Validate release data
        id: snapshot
        run: |
          set -euo pipefail
          python -m backend.validation | tee "$RUNNER_TEMP/release-validation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path('backend/data/refresh_status.json')
          status = json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {}
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-validation.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f"latest_trade_date={report['latest_trade_date']}", file=output)
              print(f"refreshed_at_utc={status.get('refreshed_at_utc') or 'unknown'}", file=output)
          PY

      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        # sigstore/cosign-installer does not publish a floating `v4` major
        # tag — pin to the exact patch release.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=sha-${{ steps.revision.outputs.short_sha }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=OTC-X Liquiditäts-Radar
            org.opencontainers.image.description=End-to-end intelligence for the Swiss OTC equity market
            org.opencontainers.image.url=https://otc-x-radar.streamlit.app
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.vendor=Mihael Atanasov
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            ch.otc-x.latest-trade-date=${{ steps.snapshot.outputs.latest_trade_date }}
            ch.otc-x.refreshed-at-utc=${{ steps.snapshot.outputs.refreshed_at_utc }}

      - name: Choose isolated candidate tag
        id: candidate
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHORT_SHA: ${{ steps.revision.outputs.short_sha }}
        run: |
          set -euo pipefail
          candidate=''
          while IFS= read -r tag; do
            case "$tag" in
              *":sha-${SHORT_SHA}") candidate="${tag}-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ;;
            esac
          done <<< "$TAGS"
          [ -n "$candidate" ]
          echo "tag=${candidate}" >> "$GITHUB_OUTPUT"

      # Candidate tags are deliberately separate from trusted rollback/version
      # tags. A build, signature or verification failure cannot move `latest`.
      - name: Build and push candidate (multi-arch, with SBOM and provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.candidate.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sign and verify candidate digest (keyless via Sigstore OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          set -euo pipefail
          image="${CANDIDATE_TAG}@${DIGEST}"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            > "$RUNNER_TEMP/signature-verification.json"

      - name: Promote verified digest to release tags, latest last
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="${CANDIDATE_TAG}@${DIGEST}"
          latest=''
          # A single index source is copied byte-for-byte, retaining every
          # architecture and SBOM/provenance descriptor. Never filter/annotate it.
          # https://docs.docker.com/reference/cli/docker/buildx/imagetools/create/
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              *:latest) latest="$tag" ;;
              *) docker buildx imagetools create --tag "$tag" "$image" ;;
            esac
          done <<< "$TAGS"
          [ -n "$latest" ]
          docker buildx imagetools create --tag "$latest" "$image"

      - name: Record publication receipt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          ROLLBACK_TAG: sha-${{ steps.revision.outputs.short_sha }}
          LATEST_TRADE_DATE: ${{ steps.snapshot.outputs.latest_trade_date }}
          REFRESHED_AT_UTC: ${{ steps.snapshot.outputs.refreshed_at_utc }}
        run: |
          {
            echo '### Validated OTC-X container'
            echo "Source revision: ${SOURCE_SHA}"
            echo "Image digest: ${DIGEST}"
            echo "Retained rollback tag: ${ROLLBACK_TAG}"
            echo "Latest trade date: ${LATEST_TRADE_DATE}"
            echo "Successful data refresh: ${REFRESHED_AT_UTC}"
            echo 'Dependency lock checksums:'
            sha256sum requirements.txt requirements-dev.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve release validation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-tests.xml
            ${{ runner.temp }}/release-validation.json
            ${{ runner.temp }}/signature-verification.json
          retention-days: 30
          if-no-files-found: warn
