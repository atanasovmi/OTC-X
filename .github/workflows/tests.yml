name: Tests and snapshot validation

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otc-x-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
          python -m pip check

      - name: Run all tests
        run: python -m pytest tests/ -q --junitxml="${{ runner.temp }}/tests.xml"

      - name: Validate the committed data snapshot
        run: python -m backend.validation

      - name: Preserve test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-python-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests.xml
          retention-days: 30
          if-no-files-found: warn
