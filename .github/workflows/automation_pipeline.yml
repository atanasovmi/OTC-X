name: OTC-X Daily Pipeline

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# Required for the commit-and-push step to write back pipeline artifacts
permissions:
  contents: write

# A refresh must finish publishing before another refresh of this branch starts.
concurrency:
  group: otc-x-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Prepare validation receipts
        run: mkdir -p "$RUNNER_TEMP/pipeline-reports"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: -r requirements-dev.txt 2>&1 | tee "$RUNNER_TEMP/pipeline-reports/install.log"
          python -m pip check

      - name: Test existing snapshot before refresh
        run: |
          set -euo pipefail
          python -m pytest tests/ -q --junitxml="$RUNNER_TEMP/pipeline-reports/preflight.xml" 2>&1 | tee "$RUNNER_TEMP/pipeline-reports/preflight.log"

      - name: Run main orchestrator
        run: |
          set -euo pipefail
          python -m backend.pipeline 2>&1 | tee "$RUNNER_TEMP/pipeline-reports/refresh.log"

      - name: Test refreshed snapshot
        run: |
          set -euo pipefail
          python -m pytest tests/ -q --junitxml="$RUNNER_TEMP/pipeline-reports/post-refresh.xml" 2>&1 | tee "$RUNNER_TEMP/pipeline-reports/post-refresh.log"

      - name: Validate refreshed data and record successful refresh
        run: |
          set -euo pipefail
          python -m backend.validation --write-refresh-status 2>&1 | tee "$RUNNER_TEMP/pipeline-reports/validation.log"

      # Only validated data/logs are staged. A failed commit or non-fast-forward
      # push fails the job; never merge another revision into an untested snapshot.
      - name: Commit and push new data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backend/data/ backend/logs/
          if git diff --cached --quiet; then
            echo "Validated snapshot is unchanged."
          else
            git commit -m "Automated daily OTC-X data update"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preserve refresh and validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/logs/
            ${{ runner.temp }}/pipeline-reports/
          retention-days: 30
          if-no-files-found: warn
