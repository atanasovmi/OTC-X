name: Container retention review

# Untagged GHCR versions may be architecture or attestation manifests referenced
# by retained multi-architecture image tags. Deleting them by tag absence alone
# can break partner images and rollback versions:
# https://github.com/actions/delete-package-versions/issues/162
# Keep this scheduled reminder read-only until a separately reviewed cleanup can
# prove that candidates are unreachable from every retained manifest/signature.

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-notice:
    name: Preserve partner and rollback images
    runs-on: ubuntu-latest
    steps:
      - name: Record retention policy
        run: |
          {
            echo '### OTC-X container retention'
            echo 'Automatic registry deletion is disabled to preserve retained multi-architecture images and their attestations.'
            echo 'Keep version and sha-* tags, their referenced manifests, signatures, SBOMs and provenance.'
            echo 'Any future cleanup must inspect the complete manifest graph and be reviewed before deletion.'
          } >> "$GITHUB_STEP_SUMMARY"
